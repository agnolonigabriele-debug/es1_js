
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietti cinema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body data-bs-theme="dark">

    <div class="position-relative overflow-hidden min-vh-100 w-100 d-flex align-items-center justify-content-center">

        <video autoplay muted loop playsinline
            class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover">
            <source src="videos/matrix.mp4" type="video/mp4">
        </video>

        <!-- Overlay scuro per coprire leggermente il video -->
        <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50"></div>

        <!-- container sopra il video di matrix -->
        <div class="container position-relative z-1 py-5">
            <div class="row justify-content-center align-items-center text-center g-3 bg-black p-3 rounded-4">

                <div class="col-md-6">
                    <div class="">
                        <h1>Biglietti cinema</h1>

                        <ul class="prezzi">
                            <li><span>Costo per adulti: </span>8€</li>
                            <li><span>Costo minori di 5 anni: </span>free</li>
                            <li><span>Costo per clienti con età compresa tra i 18 e 25 anni: </span>3.5€</li>
                            <li><span>Clienti con età compresa tra i 50 e i 55 anni: </span>5€</li>
                        </ul>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="d-flex flex-column align-items-center justify-content-center">
                        <h2>Lo script</h2>
                        <button onclick="acquista();" class="btn btn-light btn-animato mt-2">
                            Acquista
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/scrips.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
